<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crown Head Spa - Receipt Gallery</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1849">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrownOS">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="receipt-gallery.css">

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
    <script src="crown-store.js"></script>
    <script type="text/crown-deferred" src="firebase-init.js"></script>
    <script type="text/crown-deferred" src="pwa-register.js"></script>
    <script type="text/crown-deferred" src="client-store.js"></script>
    <script type="text/crown-deferred" src="firebase-sync.js"></script>
    <script type="text/crown-deferred" src="activity-log.js"></script>
    <script type="text/crown-deferred" src="access-control.js"></script>
    <script type="text/crown-deferred" src="notifications.js"></script>
    <script type="text/crown-deferred" src="push-notifications.js"></script>
</head>

<body>

<div class="container-fluid px-3 px-lg-4 py-4">

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <div class="page-heading">
                <div>
                    <h2 class="fw-bold text-primary mb-0">Receipt Gallery</h2>
                    <p class="text-muted mb-0">Keep a record of receipts with their date, amount, notes and attachments.</p>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-primary" id="rgAddBtn">Upload Receipt</button>
                    <a href="home.html" class="btn-dashboard text-decoration-none">← Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="rg-filters">
                <div>
                    <label for="rgMonthFilter">Month</label>
                    <input type="month" class="form-control" id="rgMonthFilter">
                </div>
                <div>
                    <label for="rgUserFilter">Uploaded by</label>
                    <select class="form-select" id="rgUserFilter"><option value="">All</option></select>
                </div>
                <div>
                    <label for="rgSearch">Search</label>
                    <input type="text" class="form-control" id="rgSearch" placeholder="Particular or notes">
                </div>
                <div>
                    <button type="button" class="btn btn-outline-secondary" id="rgClearBtn">Clear</button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table rg-table align-middle">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Particular</th>
                            <th style="text-align:right">Amount</th>
                            <th>Notes</th>
                            <th>Attachments</th>
                            <th>Uploaded by</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="rgTableBody"></tbody>
                    <tfoot>
                        <tr>
                            <th colspan="2">Total</th>
                            <th style="text-align:right" id="rgTotal"></th>
                            <th colspan="4"></th>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div class="rg-empty d-none" id="rgEmptyState">No receipts found.</div>
        </div>
    </div>

    <div class="rg-modal-backdrop d-none" id="rgFormBackdrop">
        <div class="rg-modal">
            <div class="rg-modal-header">
                <h4 id="rgFormTitle">Upload Receipt</h4>
                <button type="button" class="rg-modal-close" data-close="rgFormBackdrop">&times;</button>
            </div>
            <div class="rg-modal-body">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-semibold" for="rgTitleInput">Particular <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="rgTitleInput" maxlength="150" placeholder="e.g. Supplier name or what was bought">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="rgDateInput">Date <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="rgDateInput">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="rgAmountInput">Amount <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="rgAmountInput" min="0" step="0.01">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold" for="rgNotesInput">Notes</label>
                        <textarea class="form-control" id="rgNotesInput" rows="2" maxlength="1000"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold" for="rgFilesInput">Attachment <span class="text-danger" id="rgFilesRequired">*</span></label>
                        <input type="file" class="form-control" id="rgFilesInput" accept="image/*,application/pdf" multiple>
                        <div class="text-muted small mt-1" id="rgFilesHint">Images or PDF, up to 10 MB each.</div>
                    </div>
                </div>
            </div>
            <div class="rg-modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-close="rgFormBackdrop">Cancel</button>
                <button type="button" class="btn btn-primary" id="rgSaveBtn">Save</button>
            </div>
        </div>
    </div>

</div>

<script type="text/crown-deferred" src="receipt-gallery.js"></script>
<script type="text/crown-deferred" src="sidebar.js"></script>
</body>
</html>
