<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crown Head Spa - Staff Schedule</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1849">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrownOS">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="staff-schedule.css">

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="pwa-register.js"></script>
    <script src="client-store.js"></script>
    <script src="firebase-sync.js"></script>
    <script src="access-control.js"></script>
    <script src="notifications.js"></script>
</head>

<body>

<div class="container-fluid px-3 px-lg-4 py-4">

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

            <div class="page-heading">
                <div>
                    <h2 class="fw-bold text-primary mb-0">Staff Schedule</h2>
                    <p class="text-muted mb-0" id="staffSchedulePageSubtitle">
                        Weekly duty roster.
                    </p>
                </div>

                <a href="home.html" class="btn-dashboard text-decoration-none">
                    ← Back to Dashboard
                </a>
            </div>

        </div>
    </div>

    <!-- Admin / Executive Assistant / Team Leader view: current week + History/Upcoming/Create -->
    <div class="card shadow-sm border-0 mb-4 d-none" id="scheduleGridCard">
        <div class="card-body">

            <div class="schedule-toolbar">
                <div class="schedule-toolbar-fields">
                    <div class="schedule-field d-none" id="scheduleBranchWrap">
                        <label for="scheduleBranchSelect">Branch</label>
                        <select id="scheduleBranchSelect"></select>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-primary d-none" id="scheduleCreateBtn">Create Schedule</button>
                </div>
            </div>

            <div class="schedule-band-title" id="scheduleTitleBand">Weekly Schedule</div>

            <div id="scheduleCurrentGrid">
                <div class="table-responsive">
                    <table class="schedule-section-table" id="scheduleCurrentOpeningTable"></table>
                </div>
                <div class="table-responsive mt-4">
                    <table class="schedule-section-table" id="scheduleCurrentClosingTable"></table>
                </div>
                <div class="table-responsive mt-4">
                    <table class="schedule-section-table" id="scheduleCurrentRestTable"></table>
                </div>
                <div class="table-responsive mt-4">
                    <table class="schedule-section-table" id="scheduleCurrentNotesTable"></table>
                </div>

                <div class="text-end mt-3 d-none" id="scheduleCurrentEditWrap">
                    <button type="button" class="btn btn-outline-primary" id="scheduleCurrentEditBtn">Edit Schedule</button>
                </div>
            </div>

            <div class="empty-state d-none" id="scheduleCurrentEmpty">No schedule generated for this week yet.</div>

            <!-- History: collapsible banner, expands inline -->
            <button type="button" class="schedule-collapse-band mt-4" id="scheduleHistoryToggle">
                <span class="schedule-collapse-fill"></span>
                <span class="schedule-collapse-label">History</span>
            </button>
            <div class="schedule-collapse-body d-none" id="scheduleHistoryBody">
                <div class="schedule-week-list" id="scheduleHistoryList"></div>
                <div class="empty-state d-none" id="scheduleHistoryEmpty">No past schedules yet.</div>
            </div>

            <!-- Upcoming: collapsible banner, expands inline -->
            <button type="button" class="schedule-collapse-band mt-3" id="scheduleUpcomingToggle">
                <span class="schedule-collapse-fill"></span>
                <span class="schedule-collapse-label">Upcoming Schedule</span>
            </button>
            <div class="schedule-collapse-body d-none" id="scheduleUpcomingBody">
                <div class="schedule-week-list" id="scheduleUpcomingList"></div>
                <div class="empty-state d-none" id="scheduleUpcomingEmpty">No upcoming schedules yet.</div>
            </div>

        </div>
    </div>

    <!-- Read-only view modal (History items) -->
    <div class="schedule-modal-backdrop d-none" id="scheduleViewBackdrop">
        <div class="schedule-edit-modal">
            <div class="schedule-modal-header">
                <h4 id="scheduleViewModalTitle">Schedule</h4>
                <button type="button" class="schedule-modal-close" id="scheduleViewCloseBtn">&times;</button>
            </div>
            <div class="schedule-modal-body">
                <div class="table-responsive">
                    <table class="schedule-section-table" id="scheduleViewOpeningTable"></table>
                </div>
                <div class="table-responsive mt-4">
                    <table class="schedule-section-table" id="scheduleViewClosingTable"></table>
                </div>
                <div class="table-responsive mt-4">
                    <table class="schedule-section-table" id="scheduleViewRestTable"></table>
                </div>
                <div class="table-responsive mt-4">
                    <table class="schedule-section-table" id="scheduleViewNotesTable"></table>
                </div>
            </div>
            <div class="schedule-modal-footer">
                <button type="button" class="btn btn-outline-secondary" id="scheduleViewCloseFooterBtn">Close</button>
            </div>
        </div>
    </div>

    <!-- Create / Edit modal -->
    <div class="schedule-modal-backdrop d-none" id="scheduleEditBackdrop">
        <div class="schedule-edit-modal">
            <div class="schedule-modal-header">
                <h4 id="scheduleEditModalTitle">Create Schedule</h4>
                <button type="button" class="schedule-modal-close" id="scheduleEditCloseBtn">&times;</button>
            </div>

            <div class="schedule-modal-body">
                <div class="schedule-field mb-3" id="scheduleEditWeekWrap">
                    <label for="scheduleEditWeekInput">Week</label>
                    <select id="scheduleEditWeekInput"></select>
                </div>

                <div class="table-responsive">
                    <table class="schedule-section-table" id="scheduleEditOpeningTable"></table>
                </div>
                <div class="schedule-add-row" id="scheduleEditOpeningAddWrap">
                    <button type="button" class="schedule-add-link" data-section="opening">+ Add Therapist</button>
                </div>

                <div class="table-responsive mt-4">
                    <table class="schedule-section-table" id="scheduleEditClosingTable"></table>
                </div>
                <div class="schedule-add-row" id="scheduleEditClosingAddWrap">
                    <button type="button" class="schedule-add-link" data-section="closing">+ Add Therapist</button>
                </div>

                <div class="table-responsive mt-4">
                    <table class="schedule-section-table" id="scheduleEditRestTable"></table>
                </div>

                <div class="table-responsive mt-4">
                    <table class="schedule-section-table" id="scheduleEditNotesTable"></table>
                </div>
            </div>

            <div class="schedule-modal-footer">
                <button type="button" class="btn btn-outline-secondary" id="scheduleEditCancelBtn">Cancel</button>
                <button type="button" class="btn btn-outline-danger d-none" id="scheduleEditClearBtn">Clear Schedule</button>
                <button type="button" class="btn btn-primary" id="scheduleEditSubmitBtn">Generate Schedule</button>
            </div>
        </div>
    </div>

    <!-- Therapist / Receptionist view: own assignments only -->
    <div class="card shadow-sm border-0 mb-4 d-none" id="scheduleOwnCard">
        <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
                <div class="schedule-field">
                    <label for="scheduleOwnWeekInput">Week</label>
                    <select id="scheduleOwnWeekInput"></select>
                </div>
            </div>

            <div class="schedule-own-list" id="scheduleOwnList"></div>
            <div class="empty-state d-none" id="scheduleOwnEmpty">No duty assigned to you this week.</div>

            <!-- Upcoming: collapsible banner, expands inline, own items only -->
            <button type="button" class="schedule-collapse-band mt-3" id="scheduleOwnUpcomingToggle">
                <span class="schedule-collapse-fill"></span>
                <span class="schedule-collapse-label">Upcoming Schedule</span>
            </button>
            <div class="schedule-collapse-body d-none" id="scheduleOwnUpcomingBody">
                <div id="scheduleOwnUpcomingList"></div>
                <div class="empty-state d-none" id="scheduleOwnUpcomingEmpty">No upcoming schedule yet.</div>
            </div>
        </div>
    </div>

    <!-- On Leave this week — Admin / Executive Assistant / Team Leader only -->
    <div class="card shadow-sm border-0 d-none" id="scheduleLeaveCard">
        <div class="card-body">
            <h6 class="fw-bold text-primary mb-3">On Leave This Week</h6>
            <div class="schedule-leave-list" id="scheduleLeaveList"></div>
        </div>
    </div>

</div>

<script src="staff-schedule.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
