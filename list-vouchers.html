<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crown Head Spa - Voucher Masterlist</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1849">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrownOS">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="list-vouchers.css">

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="pwa-register.js"></script>
    <script src="firebase-sync.js"></script>
    <script src="access-control.js"></script>
    <script src="notifications.js"></script>
</head>

<body>

<div class="container-fluid px-3 px-lg-4 py-4">

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

            <div class="page-heading">
                <div>
                    <h2 class="fw-bold text-primary mb-0">Voucher Masterlist</h2>
                </div>

                <a href="home.html" class="btn-dashboard text-decoration-none">
                    ← Back to Dashboard
                </a>
            </div>

            <div class="voucher-summary-tiles">
                <div class="voucher-tile">
                    <span>Total Issued</span>
                    <strong id="tileTotal">0</strong>
                    <small id="tileTotalValue">₱0.00</small>
                </div>

                <div class="voucher-tile voucher-tile-active">
                    <span>Active (Unredeemed)</span>
                    <strong id="tileActive">0</strong>
                    <small id="tileActiveValue">₱0.00</small>
                </div>

                <div class="voucher-tile voucher-tile-redeemed">
                    <span>Redeemed</span>
                    <strong id="tileRedeemed">0</strong>
                    <small id="tileRedeemedValue">₱0.00</small>
                </div>

                <div class="voucher-tile voucher-tile-cancelled">
                    <span>Voided</span>
                    <strong id="tileCancelled">0</strong>
                    <small id="tileCancelledValue">₱0.00</small>
                </div>
            </div>

        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
                <div class="d-flex flex-wrap gap-2 align-items-end">
                    <div>
                        <label class="form-label fw-bold mb-1">Search</label>
                        <input
                            type="text"
                            id="voucherSearch"
                            class="form-control"
                            placeholder="Voucher # or client name"
                            autocomplete="off"
                        >
                    </div>

                    <div>
                        <label class="form-label fw-bold mb-1">Status</label>
                        <select id="voucherStatusFilter" class="form-select">
                            <option value="">All Statuses</option>
                            <option value="active">Active</option>
                            <option value="redeemed">Redeemed</option>
                            <option value="cancelled">Voided</option>
                        </select>
                    </div>
                </div>

                <div class="voucher-count-box">
                    Showing: <strong id="voucherShownCount">0</strong>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table voucher-list-table align-middle">
                    <thead>
                        <tr>
                            <th>Voucher #</th>
                            <th>Item</th>
                            <th>Value</th>
                            <th>Client</th>
                            <th>Issued</th>
                            <th>Status</th>
                            <th>Redemption</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="voucherListBody"></tbody>
                </table>
            </div>

            <div class="empty-state d-none" id="voucherEmptyState">
                No vouchers found. Vouchers generated from the Daily Income
                Report will appear here automatically.
            </div>

        </div>
    </div>

</div>

<script src="voucher-print.js"></script>
<script src="list-vouchers.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
