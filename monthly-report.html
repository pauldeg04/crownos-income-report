<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crown Head Spa - Monthly Income Summary</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1849">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrownOS">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="crownos-theme.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="monthly-report.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>
<script>if(!localStorage.getItem("crownSelectedBranch")){location.href="home.html";}</script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="pwa-register.js"></script>
    <script src="client-store.js"></script>
    <script src="firebase-sync.js"></script>
    <script src="access-control.js"></script>
    <script src="notifications.js"></script>
<script src="crownos-theme.js"></script>
</head>

<body>

<div class="container-fluid px-4 py-4" id="reportArea">

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-3 page-heading">
                <div>
                    <h2 class="fw-bold text-primary mb-0">
                        Crown Head Spa - Monthly Income Summary
                    </h2>
                </div>

                <a href="home.html" class="btn-dashboard text-decoration-none">
                    ← Back to Dashboard
                </a>
            </div>

            <div class="row g-3">
                <!-- Branch is now shown in the header toolbar, so this
                     readout duplicated it — hidden, not deleted, since
                     monthly-report.js still writes to #branchReadout. -->
                <div class="col-md-4 d-none">
                    <label class="form-label fw-bold">Branch</label>
                    <div class="branch-readout" id="branchReadout">—</div>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold">Month</label>
                    <input type="month" id="month" class="form-control" onchange="generateReport()">
                </div>
            </div>

        </div>
    </div>

    <div class="button-area mb-4">
        <button class="btn btn-primary" onclick="generateReport()">Generate Report</button>
        <button class="btn btn-purple" id="exportPdfBtn" onclick="exportPDF()">Export to PDF</button>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0 report-table">
                    <thead class="table-primary text-center">
                        <tr>
                            <th>Date</th>
                            <th>Cash</th>
                            <th>GCash</th>
                            <th>Bank Transfer</th>
                            <th>Terminal</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="monthlyBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0 summary-card">
        <div class="card-body">
            <h3 class="fw-bold mb-3">Summary</h3>

            <div class="table-responsive">
                <table class="table table-bordered summary-table">
                    <thead class="table-dark text-center">
                        <tr>
                            <th>Category</th>
                            <th>Total Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="payment-summary-cash">
                            <td>Cash</td>
                            <td id="sumCash">₱0.00</td>
                        </tr>
                        <tr class="payment-summary-gcash">
                            <td>GCash</td>
                            <td id="sumGcash">₱0.00</td>
                        </tr>
                        <tr class="payment-summary-bank">
                            <td>Bank Transfer</td>
                            <td id="sumBank">₱0.00</td>
                        </tr>
                        <tr class="payment-summary-terminal">
                            <td>Terminal</td>
                            <td id="sumTerminal">₱0.00</td>
                        </tr>
                        <tr class="grand-total">
                            <td>Grand Total</td>
                            <td id="grandTotal">₱0.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="monthly-report.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
