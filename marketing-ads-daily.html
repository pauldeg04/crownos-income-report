<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crown Head Spa - Ads Monitoring</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1849">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrownOS">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="marketing.css">

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="pwa-register.js"></script>
    <script src="client-store.js"></script>
    <script src="firebase-sync.js"></script>
    <script src="access-control.js"></script>
    <script src="notifications.js"></script>
    <script src="push-notifications.js"></script>
</head>

<body>

<div class="container-fluid px-3 px-lg-4 py-4">

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

            <div class="page-heading">
                <div>
                    <h2 class="fw-bold text-primary mb-0">Ads Monitoring</h2>
                    <p class="text-muted mb-0">
                        Per-campaign log of ad performance updates.
                    </p>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-primary" id="marketingCreateCampaignBtn">+ Create Campaign</button>
                    <a href="home.html" class="btn-dashboard text-decoration-none">
                        ← Back to Dashboard
                    </a>
                </div>
            </div>

        </div>
    </div>

    <div id="marketingCampaignsContainer"></div>

    <div class="card shadow-sm border-0 d-none" id="marketingEmptyCard">
        <div class="card-body">
            <div class="empty-state">No campaigns yet. Click "Create Campaign" to start one.</div>
        </div>
    </div>

    <!-- History (archived campaigns) — collapsed by default, own section
         at the bottom so it doesn't crowd the active campaigns above. -->
    <div class="card shadow-sm border-0 mt-4">
        <div class="card-body">
            <button type="button" class="marketing-collapse-toggle" id="marketingHistoryToggle">
                <span>History (Archived Campaigns)</span>
                <span class="marketing-collapse-chevron" aria-hidden="true">▸</span>
            </button>

            <div class="marketing-collapse-body d-none" id="marketingHistoryBody">
                <div class="table-responsive">
                    <table class="table marketing-table align-middle">
                        <thead>
                            <tr>
                                <th>Campaign</th>
                                <th>Archived</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="marketingHistoryTableBody"></tbody>
                    </table>
                </div>

                <div class="empty-state d-none" id="marketingHistoryEmptyState">No archived campaigns yet.</div>
            </div>
        </div>
    </div>

    <!-- Create Campaign modal -->
    <div class="marketing-modal-backdrop d-none" id="marketingCreateBackdrop">
        <div class="marketing-modal">
            <div class="marketing-modal-header">
                <h4>Create Campaign</h4>
                <button type="button" class="marketing-modal-close" id="marketingCreateCloseBtn">&times;</button>
            </div>

            <div class="marketing-modal-body">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-semibold">Campaign Name</label>
                        <input type="text" class="form-control" id="marketingCreateNameInput" placeholder="Campaign name">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">CPM (Cost per Message)</label>
                        <div class="input-group">
                            <span class="input-group-text">₱</span>
                            <input type="number" class="form-control" id="marketingCreateCpmInput" min="0" step="0.01" placeholder="0.00">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Cost</label>
                        <div class="input-group">
                            <span class="input-group-text">₱</span>
                            <input type="number" class="form-control" id="marketingCreateCostInput" min="0" step="0.01" placeholder="0.00">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Impression</label>
                        <input type="number" class="form-control" id="marketingCreateImpressionInput" min="0" step="1" placeholder="0">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Views</label>
                        <input type="number" class="form-control" id="marketingCreateViewsInput" min="0" step="1" placeholder="0">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Inquiries</label>
                        <input type="number" class="form-control" id="marketingCreateInquiriesInput" min="0" step="1" placeholder="0">
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Notes</label>
                        <textarea class="form-control" id="marketingCreateNotesInput" rows="3"></textarea>
                    </div>
                </div>
            </div>

            <div class="marketing-modal-footer">
                <button type="button" class="btn btn-outline-secondary" id="marketingCreateCancelBtn">Cancel</button>
                <button type="button" class="btn btn-primary" id="marketingCreateSaveBtn">Save</button>
            </div>
        </div>
    </div>

    <!-- Update (add new entry) modal -->
    <div class="marketing-modal-backdrop d-none" id="marketingUpdateBackdrop">
        <div class="marketing-modal">
            <div class="marketing-modal-header">
                <h4 id="marketingUpdateTitle">Update Campaign</h4>
                <button type="button" class="marketing-modal-close" id="marketingUpdateCloseBtn">&times;</button>
            </div>

            <div class="marketing-modal-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">CPM (Cost per Message)</label>
                        <div class="input-group">
                            <span class="input-group-text">₱</span>
                            <input type="number" class="form-control" id="marketingUpdateCpmInput" min="0" step="0.01" placeholder="0.00">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Cost</label>
                        <div class="input-group">
                            <span class="input-group-text">₱</span>
                            <input type="number" class="form-control" id="marketingUpdateCostInput" min="0" step="0.01" placeholder="0.00">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Impression</label>
                        <input type="number" class="form-control" id="marketingUpdateImpressionInput" min="0" step="1" placeholder="0">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Views</label>
                        <input type="number" class="form-control" id="marketingUpdateViewsInput" min="0" step="1" placeholder="0">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Inquiries</label>
                        <input type="number" class="form-control" id="marketingUpdateInquiriesInput" min="0" step="1" placeholder="0">
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Notes</label>
                        <textarea class="form-control" id="marketingUpdateNotesInput" rows="3"></textarea>
                    </div>
                </div>
            </div>

            <div class="marketing-modal-footer">
                <button type="button" class="btn btn-outline-secondary" id="marketingUpdateCancelBtn">Cancel</button>
                <button type="button" class="btn btn-primary" id="marketingUpdateSaveBtn">Save</button>
            </div>
        </div>
    </div>

    <!-- View (full history) modal -->
    <div class="marketing-modal-backdrop d-none" id="marketingViewBackdrop">
        <div class="marketing-modal marketing-modal-wide">
            <div class="marketing-modal-header">
                <h4 id="marketingViewTitle">Campaign History</h4>
                <button type="button" class="marketing-modal-close" id="marketingViewCloseBtn">&times;</button>
            </div>

            <div class="marketing-modal-body" id="marketingViewBody"></div>

            <div class="marketing-modal-footer">
                <button type="button" class="btn btn-outline-secondary" id="marketingViewCloseFooterBtn">Close</button>
            </div>
        </div>
    </div>


</div>

<script src="marketing-ads-daily.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
