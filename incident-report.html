<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crown Head Spa - Incident Report</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1849">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrownOS">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="incident-report.css">

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="pwa-register.js"></script>
    <script src="client-store.js"></script>
    <script src="firebase-sync.js"></script>
    <script src="access-control.js"></script>
    <script src="notifications.js"></script>
    <script src="push-notifications.js"></script>
</head>

<body>

<div class="container-fluid px-3 px-lg-4 py-4">

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

            <div class="page-heading">
                <div>
                    <h2 class="fw-bold text-primary mb-0">Incident Report</h2>
                    <p class="text-muted mb-0">
                        Log a workplace incident for the record.
                    </p>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-primary" id="incidentReportBtn">Report Incident</button>
                    <a href="home.html" class="btn-dashboard text-decoration-none">
                        ← Back to Dashboard
                    </a>
                </div>
            </div>

        </div>
    </div>

    <div class="card shadow-sm border-0 d-none" id="incidentListCard">
        <div class="card-body">
            <h5 class="fw-bold text-primary mb-3">Submitted Reports</h5>

            <div class="table-responsive">
                <table class="table incident-table align-middle">
                    <thead>
                        <tr>
                            <th>Date / Time</th>
                            <th>Branch</th>
                            <th>Involved Persons</th>
                            <th>Reported By</th>
                            <th>Submitted</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="incidentTableBody"></tbody>
                </table>
            </div>

            <div class="empty-state d-none" id="incidentEmptyState">No incident reports yet.</div>
        </div>
    </div>

    <!-- Report Incident form modal -->
    <div class="incident-modal-backdrop d-none" id="incidentFormBackdrop">
        <div class="incident-modal">
            <div class="incident-modal-header">
                <h4>Incident Report Form</h4>
                <button type="button" class="incident-modal-close" id="incidentFormCloseBtn">&times;</button>
            </div>

            <div class="incident-modal-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Date of Incident</label>
                        <input type="date" class="form-control" id="incidentDateInput">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Time of Incident</label>
                        <input type="time" class="form-control" id="incidentTimeInput">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Branch</label>
                        <select class="form-select" id="incidentBranchInput"></select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Reported By</label>
                        <input type="text" class="form-control" id="incidentReportedByInput" readonly>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Involved Persons</label>
                        <textarea class="form-control" id="incidentInvolvedInput" rows="2"></textarea>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" id="incidentDescriptionInput" rows="3"></textarea>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Actions Taken</label>
                        <textarea class="form-control" id="incidentActionsInput" rows="3"></textarea>
                    </div>
                </div>
            </div>

            <div class="incident-modal-footer">
                <button type="button" class="btn btn-outline-secondary" id="incidentFormCancelBtn">Cancel</button>
                <button type="button" class="btn btn-primary" id="incidentFormSubmitBtn">Submit</button>
            </div>
        </div>
    </div>

    <!-- View modal -->
    <div class="incident-modal-backdrop d-none" id="incidentViewBackdrop">
        <div class="incident-modal">
            <div class="incident-modal-header">
                <h4>Incident Report</h4>
                <button type="button" class="incident-modal-close" id="incidentViewCloseBtn">&times;</button>
            </div>

            <div class="incident-modal-body" id="incidentViewBody"></div>

            <div class="incident-modal-footer">
                <button type="button" class="btn btn-outline-secondary" id="incidentViewCloseFooterBtn">Close</button>
            </div>
        </div>
    </div>

</div>

<script src="incident-report.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
