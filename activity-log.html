<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CrownOS - Activity Log</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1849">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrownOS">


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="activity-log.css">

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
    <script src="crown-store.js"></script>
    <script type="text/crown-deferred" src="firebase-init.js"></script>
    <script type="text/crown-deferred" src="pwa-register.js"></script>
    <script type="text/crown-deferred" src="client-store.js"></script>
    <script type="text/crown-deferred" src="firebase-sync.js"></script>
    <script type="text/crown-deferred" src="activity-log.js"></script>
    <script type="text/crown-deferred" src="access-control.js"></script>
    <script type="text/crown-deferred" src="notifications.js"></script>
    <script type="text/crown-deferred" src="push-notifications.js"></script>
</head>

<body>

<div class="container-fluid px-3 px-lg-4 py-4">

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <p class="page-eyebrow">Admin only</p>

            <h2 class="fw-bold text-primary mb-0">
                Activity Log
            </h2>

            <small class="text-muted">
                Who did what in CrownOS, per day. Entries can't be edited or
                deleted, and are kept for 90 days.
            </small>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

            <div class="activity-filters">
                <div class="activity-date">
                    <label class="form-label" for="activityDate">Date</label>
                    <div class="input-group">
                        <button type="button" class="btn btn-outline-secondary" id="activityPrevDay" aria-label="Previous day">‹</button>
                        <input type="date" class="form-control" id="activityDate">
                        <button type="button" class="btn btn-outline-secondary" id="activityNextDay" aria-label="Next day">›</button>
                    </div>
                </div>

                <div>
                    <label class="form-label" for="activityUser">User</label>
                    <select class="form-select" id="activityUser">
                        <option value="">All users</option>
                    </select>
                </div>

                <div>
                    <label class="form-label" for="activityBranch">Branch</label>
                    <select class="form-select" id="activityBranch">
                        <option value="">All branches</option>
                    </select>
                </div>

                <div>
                    <label class="form-label" for="activityModule">Module</label>
                    <select class="form-select" id="activityModule">
                        <option value="">All modules</option>
                    </select>
                </div>

                <div>
                    <label class="form-label" for="activitySearch">Search</label>
                    <input type="search" class="form-control" id="activitySearch" placeholder="Client, item, action…">
                </div>
            </div>

            <div class="activity-toolbar">
                <span id="activityCount" class="text-muted">Loading…</span>
                <button type="button" class="btn btn-sm btn-outline-primary" id="activityExport">Export CSV</button>
            </div>

            <div id="activityMessage" class="alert alert-warning d-none mb-3"></div>

            <div class="table-responsive">
                <table class="table activity-table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>User</th>
                            <th>Branch</th>
                            <th>Module</th>
                            <th>Activity</th>
                        </tr>
                    </thead>
                    <tbody id="activityRows"></tbody>
                </table>
            </div>

            <p id="activityEmpty" class="text-muted text-center py-4 mb-0 d-none">
                No activity recorded for this day.
            </p>

        </div>
    </div>

</div>

<script type="text/crown-deferred" src="sidebar.js"></script>
<script type="text/crown-deferred" src="activity-log-page.js"></script>

</body>
</html>
