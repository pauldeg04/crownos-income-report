<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crown Head Spa - Sales Invoice Summary</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1849">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrownOS">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="invoice-report.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="pwa-register.js"></script>
    <script src="firebase-sync.js"></script>
    <script src="access-control.js"></script>
    <script src="notifications.js"></script>
</head>

<body>

<div class="container-fluid px-3 px-lg-4 py-4">

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

            <div class="page-heading">
                <div>
                    <h2 class="fw-bold text-primary mb-0">Sales Invoice Summary</h2>
                </div>

                <a href="home.html" class="btn-dashboard text-decoration-none">
                    ← Back to Dashboard
                </a>
            </div>

            <div class="row g-3 mt-1">
                <div class="col-md-3">
                    <label class="form-label fw-bold">Month</label>
                    <input type="month" id="invoiceMonth" class="form-control">
                </div>

                <!-- Branch is now selected from the header toolbar. This
                     select isn't in sidebar.js's auto-synced id list, so
                     invoice-report.js listens for crownGlobalFiltersChanged
                     itself (see loadBranchOptions/DOMContentLoaded) to keep
                     it and the report in step with the header. -->
                <div class="col-md-3 d-none">
                    <label class="form-label fw-bold">Branch</label>
                    <select id="invoiceBranch" class="form-select"></select>
                </div>
            </div>

        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <div>
                    <h3 class="fw-bold mb-0">Invoiced Transactions</h3>
                    <small class="text-muted" id="invoiceSubtitle">—</small>
                </div>

                <div class="d-flex flex-wrap align-items-center gap-2">
                    <button type="button" class="btn btn-outline-primary" id="exportInvoicePdfBtn">
                        Export as PDF
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table invoice-table align-middle">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Particulars</th>
                            <th>Invoice Number</th>
                            <th>TIN Number</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody id="invoiceBody"></tbody>
                    <tfoot>
                        <tr class="invoice-grand-row">
                            <td colspan="4">Total</td>
                            <td id="invoiceFooterTotal">₱0.00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <div class="empty-state d-none" id="invoiceEmptyState">
                No invoiced transactions found for this period. Check
                "Issue Invoice" on a sale in the Daily Income Report to
                have it appear here.
            </div>

        </div>
    </div>

</div>

<script src="invoice-report.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
