<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crown Head Spa - Expenses Report</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1849">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrownOS">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="expenses-report.css">
<script>if(!localStorage.getItem("crownSelectedBranch")){location.href="home.html";}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="pwa-register.js"></script>
    <script src="firebase-sync.js"></script>
    <script src="access-control.js"></script>
    <script src="notifications.js"></script>
</head>

<body>

<div class="container-fluid px-4 py-4">

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h2 class="fw-bold text-primary mb-0">Crown Head Spa - Expenses Report</h2>
                </div>

                <a href="home.html" class="btn-dashboard text-decoration-none">
                    ← Back to Dashboard
                </a>
            </div>

            <div class="row g-3 mb-2">
                <!-- Branch is now shown in the header toolbar, so this
                     readout duplicated it — hidden, not deleted, since
                     expenses-report.js still writes to #branchReadout. -->
                <div class="col-md-4 d-none">
                    <label class="form-label fw-bold">Branch</label>
                    <div class="branch-readout" id="branchReadout">—</div>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold">Month</label>
                    <input type="month" id="month" class="form-control" onchange="changeBranchMonth()">
                </div>
            </div>

        </div>
    </div>

    <div id="tablesContainer"></div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <h3 class="fw-bold">Summary Table</h3>

            <table class="table table-bordered summary-table">
                <thead class="table-dark">
                    <tr>
                        <th>Expense Category</th>
                        <th>Total Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>Operation Expenses</td><td id="summaryOperation">₱0.00</td></tr>
                    <tr><td>Salary</td><td id="summarySalary">₱0.00</td></tr>
                    <tr><td>Utilities / Monthly Dues</td><td id="summaryUtilities">₱0.00</td></tr>
                    <tr><td>Installments</td><td id="summaryInstallments">₱0.00</td></tr>
                    <tr><td>Accounting / Government Dues</td><td id="summaryGov">₱0.00</td></tr>
                    <tr><td>Marketing</td><td id="summaryMarketing">₱0.00</td></tr>
                    <tr class="grand-row"><td>Total Expenses</td><td id="summaryGrand">₱0.00</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="text-center mb-4">
        <button type="button" class="btn btn-navy btn-lg export-pdf-btn" id="exportExpensesPdfBtn">Export to PDF</button>
    </div>

</div>

<!-- Add / Edit Expense Entry modal (shared by every category table) -->
<div class="expense-modal-backdrop d-none" id="expenseModalBackdrop">
    <div class="expense-modal">
        <div class="expense-modal-header">
            <h4 id="expenseModalTitle">Add Particular</h4>
            <button type="button" class="expense-modal-close" id="closeExpenseModalBtn">&times;</button>
        </div>

        <div class="expense-modal-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Date</label>
                    <input type="date" id="expenseModalDate" class="form-control">
                </div>

                <div class="col-md-6 d-none" id="expenseModalCategoryWrapper">
                    <label class="form-label fw-bold">Category</label>
                    <select id="expenseModalCategory" class="form-select">
                        <option value="">Select Category</option>
                        <option value="Operation Supplies">Operation Supplies</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Management">Management</option>
                        <option value="Branch Expenses">Branch Expenses</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div class="col-12">
                    <label class="form-label fw-bold">Particular</label>
                    <input type="text" id="expenseModalParticular" class="form-control" placeholder="e.g. Bond paper, Water bill...">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold">Amount</label>
                    <div class="input-group">
                        <span class="input-group-text">₱</span>
                        <input type="number" id="expenseModalAmount" class="form-control" placeholder="0.00" min="0" step="0.01">
                    </div>
                </div>

                <div class="col-md-6 d-none" id="expenseModalPaymentWrapper">
                    <label class="form-label fw-bold">Mode of Payment</label>
                    <select id="expenseModalPayment" class="form-select">
                        <option value="">Select Mode of Payment</option>
                        <option value="Cash">Cash</option>
                        <option value="Gcash">Gcash</option>
                        <option value="Petty Cash">Petty Cash</option>
                        <option value="BDO">BDO</option>
                        <option value="RCBC">RCBC</option>
                    </select>
                </div>

                <div class="col-12">
                    <label class="form-label fw-bold">Remarks</label>
                    <input type="text" id="expenseModalRemarks" class="form-control" placeholder="Optional remarks">
                </div>
            </div>
        </div>

        <div class="expense-modal-footer expense-modal-footer-split">
            <button type="button" class="btn btn-outline-danger d-none" id="deleteExpenseEntryBtn">Delete</button>

            <div class="expense-modal-footer-right">
                <button type="button" class="btn btn-outline-secondary" id="cancelExpenseModalBtn">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveExpenseEntryBtn">Save</button>
            </div>
        </div>
    </div>
</div>

<script src="expenses-report.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
