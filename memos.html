<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crown Head Spa - Memo</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1849">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrownOS">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="memos.css">

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="pwa-register.js"></script>
    <script src="client-store.js"></script>
    <script src="firebase-sync.js"></script>
    <script src="access-control.js"></script>
    <script src="notifications.js"></script>
    <script src="push-notifications.js"></script>
</head>

<body>

<div class="container-fluid px-3 px-lg-4 py-4">

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

            <div class="page-heading">
                <div>
                    <h2 class="fw-bold text-primary mb-0">Memo</h2>
                    <p class="text-muted mb-0">
                        Send memos to specific accounts and track who has acknowledged them.
                    </p>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-outline-primary d-none" id="memoCreateGroupBtn">Create Group</button>
                    <button type="button" class="btn btn-primary d-none" id="memoComposeBtn">Compose Memo</button>
                    <a href="home.html" class="btn-dashboard text-decoration-none">
                        ← Back to Dashboard
                    </a>
                </div>
            </div>

        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <ul class="nav nav-tabs mb-3" id="memoTabs">
                <li class="nav-item">
                    <button class="nav-link active" data-tab="inbox" id="memoTabInbox">Inbox</button>
                </li>
                <li class="nav-item d-none" id="memoTabSentWrap">
                    <button class="nav-link" data-tab="sent" id="memoTabSent">Sent</button>
                </li>
            </ul>

            <div id="memoInboxPane">
                <div class="memo-list" id="memoInboxList"></div>
                <div class="empty-state d-none" id="memoInboxEmpty">No memos yet.</div>
            </div>

            <div id="memoSentPane" class="d-none">
                <div class="memo-list" id="memoSentList"></div>
                <div class="empty-state d-none" id="memoSentEmpty">You haven't sent any memos yet.</div>
            </div>

        </div>
    </div>

    <!-- Compose modal -->
    <div class="memo-modal-backdrop d-none" id="memoComposeBackdrop">
        <div class="memo-modal">
            <div class="memo-modal-header">
                <h4 id="memoComposeTitle">Compose Memo</h4>
                <button type="button" class="memo-modal-close" id="memoComposeCloseBtn">&times;</button>
            </div>

            <div class="memo-modal-body">
                <div class="mb-3">
                    <label for="memoSubjectInput" class="form-label fw-semibold">Subject</label>
                    <input type="text" class="form-control" id="memoSubjectInput" maxlength="150">
                </div>

                <div class="mb-3">
                    <label for="memoBodyInput" class="form-label fw-semibold">Message</label>
                    <textarea class="form-control" id="memoBodyInput" rows="5" maxlength="4000"></textarea>
                </div>

                <div class="mb-2 d-none" id="memoGroupPickWrap">
                    <label for="memoGroupSelect" class="form-label fw-semibold">Use a Group</label>
                    <select class="form-select" id="memoGroupSelect">
                        <option value="">— Select a group to check its members —</option>
                    </select>
                </div>

                <div class="mb-2">
                    <label class="form-label fw-semibold">Recipients</label>
                    <div class="memo-recipient-list" id="memoRecipientList"></div>
                </div>
            </div>

            <div class="memo-modal-footer">
                <button type="button" class="btn btn-outline-secondary" id="memoComposeCancelBtn">Cancel</button>
                <button type="button" class="btn btn-primary" id="memoComposeSendBtn">Send Memo</button>
                <button type="button" class="btn btn-outline-danger d-none" id="memoComposeDeleteBtn">Delete Memo</button>
            </div>
        </div>
    </div>

    <!-- Create Group modal -->
    <div class="memo-modal-backdrop d-none" id="memoGroupBackdrop">
        <div class="memo-modal">
            <div class="memo-modal-header">
                <h4>Recipient Groups</h4>
                <button type="button" class="memo-modal-close" id="memoGroupCloseBtn">&times;</button>
            </div>

            <div class="memo-modal-body">
                <div class="memo-group-existing-list" id="memoGroupExistingList"></div>

                <hr>

                <div class="mb-3">
                    <label for="memoGroupNameInput" class="form-label fw-semibold">New Group Name</label>
                    <input type="text" class="form-control" id="memoGroupNameInput" maxlength="80">
                </div>

                <div class="mb-2">
                    <label class="form-label fw-semibold">Members</label>
                    <div class="memo-recipient-list" id="memoGroupMemberList"></div>
                </div>
            </div>

            <div class="memo-modal-footer">
                <button type="button" class="btn btn-outline-secondary" id="memoGroupCloseFooterBtn">Close</button>
                <button type="button" class="btn btn-primary" id="memoGroupSaveBtn">Save Group</button>
            </div>
        </div>
    </div>

</div>

<script src="memos.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
