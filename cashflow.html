<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crown Head Spa - Cash Flow</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1849">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrownOS">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="crownos-theme.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="cashflow.css">
<script>if(!localStorage.getItem("crownSelectedBranch")){location.href="home.html";}</script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="pwa-register.js"></script>
    <script src="client-store.js"></script>
    <script src="firebase-sync.js"></script>
    <script src="access-control.js"></script>
    <script src="notifications.js"></script>
    <script src="push-notifications.js"></script>
<script src="crownos-theme.js"></script>
</head>

<body>

<div class="container-fluid px-4 py-4">

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h2 class="fw-bold text-primary mb-0">Crown Head Spa - Cash Flow</h2>
                </div>

                <a href="home.html" class="btn-dashboard text-decoration-none">
                    ← Back to Dashboard
                </a>
            </div>

            <div class="row g-3 mb-2">
                <!-- Branch is now shown in the header toolbar, so this
                     readout duplicated it — hidden, not deleted, since
                     cashflow.js still writes to #branchReadout. -->
                <div class="col-md-4 d-none">
                    <label class="form-label fw-bold">Branch</label>
                    <div class="branch-readout" id="branchReadout">—</div>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold">Month</label>
                    <input type="month" id="month" class="form-control" onchange="changeBranchMonth()">
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold">Date <small class="text-muted fw-normal">(optional filter)</small></label>
                    <div class="input-group">
                        <button
                            type="button"
                            class="date-step-btn"
                            id="prevCashflowDayBtn"
                            aria-label="Previous day"
                            title="Previous day"
                            onclick="stepCashflowDate(-1)"
                        >‹</button>

                        <input type="date" id="cashflowDateFilter" class="form-control" onchange="changeCashflowDateFilter()">

                        <button
                            type="button"
                            class="date-step-btn"
                            id="nextCashflowDayBtn"
                            aria-label="Next day"
                            title="Next day"
                            onclick="stepCashflowDate(1)"
                        >›</button>

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="todayCashflowDayBtn"
                            title="Jump to today"
                        >Today</button>

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="clearCashflowDayBtn"
                            title="Clear day filter"
                        >×</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="tabs" role="tablist" id="cashflowViewTabs"></div>

    <div class="tab-panel" data-tab-panel="cashflow">
        <div class="card shadow-sm border-0 mb-4 cashflow-card">
            <div class="card-body">

                <div class="cashflow-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <h3 class="fw-bold mb-0">Cash Flow Activities</h3>
                </div>

                <div class="cashflow-summary-banner">
                    <span>Total Cash Flow</span>
                    <strong id="cashflowGrandTotal">₱0.00</strong>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover cashflow-table">
                        <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Activity</th>
                                <th>Cash</th>
                                <th>Gcash</th>
                                <th>BDO</th>
                                <th>RCBC</th>
                                <th>Remarks</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="cashflowTotalsBody"></tbody>
                        <tbody id="cashflowBody"></tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-end mt-3 cashflow-add-entry-row">
                    <button type="button" class="btn btn-sm add-particular-btn" id="addCashflowEntryBtn">Add Entry</button>
                </div>

            </div>
        </div>
    </div>

    <div class="tab-panel d-none" data-tab-panel="moneyCounter">
        <div class="card shadow-sm border-0 mb-4 cashflow-card">
            <div class="card-body">

                <div class="cashflow-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <h3 class="fw-bold mb-0">Money Counter</h3>
                    <button type="button" class="btn btn-sm add-particular-btn" id="resetMoneyCounterBtn">Reset</button>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover cashflow-table" id="moneyCounterTable">
                        <thead class="table-light">
                            <tr>
                                <th>Money Counter</th>
                                <th style="width:140px;">Count</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="moneyCounterBody"></tbody>
                        <tfoot>
                            <tr class="totals-row">
                                <td colspan="2" class="text-end">Grand Total</td>
                                <td class="amount-cell" id="moneyCounterGrandTotal">₱0.00</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>

            </div>
        </div>
    </div>

</div>

<!-- Add / Edit Cash Flow Entry modal -->
<div class="expense-modal-backdrop d-none" id="cashflowModalBackdrop">
    <div class="expense-modal">
        <div class="expense-modal-header">
            <h4 id="cashflowModalTitle">Add Cash Flow Entry</h4>
            <button type="button" class="expense-modal-close" id="closeCashflowModalBtn">&times;</button>
        </div>

        <div class="expense-modal-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Date</label>
                    <input type="date" id="cashflowModalDate" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold">Activity</label>
                    <select id="cashflowModalType" class="form-select">
                        <option value="">Select Activity</option>
                        <option value="in">In</option>
                        <option value="out">Out</option>
                        <option value="transfer">Transfer</option>
                    </select>
                </div>

                <div class="col-md-6" id="cashflowModalAccountWrapper">
                    <label class="form-label fw-bold" id="cashflowModalAccountLabel">Account</label>
                    <select id="cashflowModalAccount" class="form-select">
                        <option value="">Select Account</option>
                    </select>
                </div>

                <div class="col-md-6" id="cashflowModalFromWrapper">
                    <label class="form-label fw-bold">Transfer From</label>
                    <select id="cashflowModalFromAccount" class="form-select">
                        <option value="">Select Account</option>
                        <option value="cash">Cash</option>
                        <option value="gcash">Gcash</option>
                        <option value="bdo">BDO</option>
                        <option value="rcbc">RCBC</option>
                    </select>
                </div>

                <div class="col-md-6" id="cashflowModalToWrapper">
                    <label class="form-label fw-bold">Transfer To</label>
                    <select id="cashflowModalToAccount" class="form-select">
                        <option value="">Select Account</option>
                        <option value="cash">Cash</option>
                        <option value="gcash">Gcash</option>
                        <option value="bdo">BDO</option>
                        <option value="rcbc">RCBC</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold">Amount</label>
                    <div class="input-group">
                        <span class="input-group-text">₱</span>
                        <input type="number" id="cashflowModalAmount" class="form-control" placeholder="0.00" min="0" step="0.01">
                    </div>
                </div>

                <div class="col-12 d-none" id="cashflowModalOutInfoWrapper">
                    <hr class="my-1">
                    <label class="form-label fw-bold mb-2">Additional Information</label>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Type</label>
                            <select id="cashflowModalExpenseType" class="form-select">
                                <option value="">Select Type</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Account Title</label>
                            <select id="cashflowModalExpenseAccountTitle" class="form-select">
                                <option value="">Select Account Title</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">Particular</label>
                            <input type="text" id="cashflowModalExpenseParticular" class="form-control" placeholder="Particular">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">S.I. No. <small class="text-muted fw-normal">(optional)</small></label>
                            <input type="text" id="cashflowModalExpenseSiNo" class="form-control" placeholder="Optional">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">TIN <small class="text-muted fw-normal">(optional)</small></label>
                            <input type="text" id="cashflowModalExpenseTin" class="form-control" placeholder="Optional">
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label fw-bold">Remarks</label>
                    <input type="text" id="cashflowModalRemarks" class="form-control" placeholder="Optional remarks">
                </div>

                <div class="col-12 d-none" id="cashflowModalAddToExpensesWrapper">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="cashflowModalAddToExpenses">
                        <label class="form-check-label fw-bold" for="cashflowModalAddToExpenses">Add to Expenses Report</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="expense-modal-footer expense-modal-footer-split">
            <button type="button" class="btn btn-outline-danger d-none" id="deleteCashflowEntryBtn">Delete</button>

            <div class="expense-modal-footer-right">
                <button type="button" class="btn btn-outline-secondary" id="cancelCashflowModalBtn">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveCashflowEntryBtn">Save</button>
            </div>
        </div>
    </div>
</div>

<script src="cashflow.js"></script>
<script src="sidebar.js"></script>
<script>
(function(){
    var DENOMINATIONS = [1000, 500, 200, 100, 50, 20, 20, 10, 5, 1];
    var STORAGE_KEY = "crownMoneyCounterCounts";

    function peso(n){
        return "₱" + n.toLocaleString("en-PH", {minimumFractionDigits:2, maximumFractionDigits:2});
    }

    function loadCounts(){
        try{
            var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
            if(Array.isArray(saved) && saved.length === DENOMINATIONS.length) return saved;
        }catch(e){}
        return DENOMINATIONS.map(function(){ return 0; });
    }

    var counts = loadCounts();

    function saveCounts(){
        localStorage.setItem(STORAGE_KEY, JSON.stringify(counts));
    }

    function updateTotals(){
        var grandTotal = 0;
        DENOMINATIONS.forEach(function(value, i){
            var count = counts[i] || 0;
            var total = value * count;
            grandTotal += total;
            document.getElementById("money-row-total-" + i).textContent = peso(total);
        });
        document.getElementById("moneyCounterGrandTotal").textContent = peso(grandTotal);
    }

    function render(){
        var body = document.getElementById("moneyCounterBody");
        body.innerHTML = "";

        DENOMINATIONS.forEach(function(value, i){
            var count = counts[i] || 0;
            var tr = document.createElement("tr");
            tr.innerHTML =
                '<td class="amount-cell">' + peso(value) + '</td>' +
                '<td><input type="number" min="0" step="1" class="form-control form-control-sm money-count-input" data-index="' + i + '" value="' + count + '"></td>' +
                '<td class="amount-cell" id="money-row-total-' + i + '"></td>';
            body.appendChild(tr);
        });

        body.querySelectorAll(".money-count-input").forEach(function(input){
            input.addEventListener("input", function(){
                var idx = parseInt(this.dataset.index, 10);
                var val = parseInt(this.value, 10);
                counts[idx] = isNaN(val) || val < 0 ? 0 : val;
                saveCounts();
                updateTotals();
            });
        });

        updateTotals();
    }

    document.getElementById("resetMoneyCounterBtn").addEventListener("click", function(){
        counts = DENOMINATIONS.map(function(){ return 0; });
        saveCounts();
        render();
    });

    render();
})();
</script>
<script>
(function(){
    var CASHFLOW_VIEW_TABS = [["cashflow", "Cashflow"], ["moneyCounter", "Money Counter"]];
    var currentCashflowTab = CASHFLOW_VIEW_TABS[0][0];

    function renderCashflowViewTabs(){
        var nav = document.getElementById("cashflowViewTabs");
        nav.innerHTML = "";

        CASHFLOW_VIEW_TABS.forEach(function(entry){
            var id = entry[0], label = entry[1];
            var b = document.createElement("button");
            b.type = "button";
            b.setAttribute("role", "tab");
            b.setAttribute("aria-selected", String(currentCashflowTab === id));
            b.textContent = label;
            b.addEventListener("click", function(){ showCashflowTab(id); });
            nav.appendChild(b);
        });
    }

    function showCashflowTab(id){
        currentCashflowTab = id;

        document.querySelectorAll("[data-tab-panel]").forEach(function(panel){
            panel.classList.toggle("d-none", panel.dataset.tabPanel !== id);
        });

        renderCashflowViewTabs();
    }

    showCashflowTab(CASHFLOW_VIEW_TABS[0][0]);
})();
</script>
</body>
</html>
