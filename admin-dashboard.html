<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crown Head Spa - Admin Dashboard</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1849">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrownOS">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="crownos-theme.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="admin-dashboard.css">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<script src="crown-store.js"></script>
<script type="text/crown-deferred" src="firebase-init.js"></script>
<script type="text/crown-deferred" src="pwa-register.js"></script>
<script type="text/crown-deferred" src="client-store.js"></script>
<script type="text/crown-deferred" src="firebase-sync.js"></script>
<script type="text/crown-deferred" src="activity-log.js"></script>
<script type="text/crown-deferred" src="access-control.js"></script>
<script type="text/crown-deferred" src="notifications.js"></script>
<script type="text/crown-deferred" src="push-notifications.js"></script>
<script type="text/crown-deferred" src="crownos-theme.js"></script>
<script type="text/crown-deferred" src="points-shared.js"></script>
</head>

<body>

<div class="container-fluid px-4 py-4">

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 page-heading">
                <div>
                    <p class="ad-eyebrow">Admin Only</p>
                    <h2 class="fw-bold text-primary mb-0">Admin Dashboard</h2>
                </div>

                <div class="ad-month-filter">
                    <label class="form-label fw-bold mb-1" for="adMonth">Month</label>
                    <input type="month" id="adMonth" class="form-control">
                </div>
            </div>
        </div>
    </div>

    <!-- 1. Notifications -->
    <h3 class="ad-section-title">Notifications</h3>
    <div class="row g-3 mb-4" id="adNotifications"></div>

    <!-- 2. Statistics -->
    <h3 class="ad-section-title">Statistics <span id="adStatsMonthLabel" class="ad-section-sub"></span></h3>
    <div id="adStatistics" class="mb-4"></div>

    <!-- 3. Share Holder Summary -->
    <h3 class="ad-section-title">Share Holder Summary <span id="adShareMonthLabel" class="ad-section-sub"></span></h3>
    <div class="row g-3 mb-4" id="adShareholders"></div>

    <!-- 4. List of Therapists -->
    <h3 class="ad-section-title">List of Therapists <span id="adTherapistMonthLabel" class="ad-section-sub"></span></h3>
    <div class="row g-3 mb-4" id="adTherapists"></div>

    <!-- 5. Service Points -->
    <h3 class="ad-section-title">Service Points <span id="adServicePointsMonthLabel" class="ad-section-sub"></span></h3>
    <div class="row g-3 mb-4" id="adServicePoints"></div>

</div>

<script type="text/crown-deferred" src="terminal-fee.js"></script>
<script type="text/crown-deferred" src="admin-dashboard.js"></script>
<script type="text/crown-deferred" src="sidebar.js"></script>

</body>
</html>
