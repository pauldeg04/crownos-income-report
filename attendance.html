<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CrownOS - Attendance</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1849">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrownOS">


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="attendance.css">

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="pwa-register.js"></script>
    <script src="firebase-sync.js"></script>
    <script src="access-control.js"></script>
</head>

<body>

<div class="container-fluid px-3 px-lg-4 py-4">

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

            <div class="page-heading">
                <div>
                    <p class="page-eyebrow">
                        Staff Records
                    </p>

                    <h2 class="fw-bold text-primary mb-0">
                        Attendance
                    </h2>
                </div>
            </div>

            <div class="row g-3 mt-1">

                <div class="col-md-4 d-none" id="staffFilterWrapper">
                    <label class="form-label fw-bold">
                        Staff
                    </label>

                    <select
                        id="staffFilter"
                        class="form-select"
                    >
                        <option value="">
                            All Staff
                        </option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold">
                        Month
                    </label>

                    <input
                        type="month"
                        id="attendanceMonth"
                        class="form-control"
                    >
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold">
                        Day
                        <small class="text-muted fw-normal">(optional)</small>
                    </label>

                    <div class="input-group">
                        <button
                            type="button"
                            class="date-step-btn"
                            id="prevAttendanceDayBtn"
                            aria-label="Previous day"
                            title="Previous day"
                        >
                            ‹
                        </button>

                        <input
                            type="date"
                            id="attendanceDay"
                            class="form-control"
                        >

                        <button
                            type="button"
                            class="date-step-btn"
                            id="nextAttendanceDayBtn"
                            aria-label="Next day"
                            title="Next day"
                        >
                            ›
                        </button>

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="clearDayFilterBtn"
                            title="Clear day filter"
                        >
                            ×
                        </button>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <div class="attendance-list-header">
                <div>
                    <h3 class="fw-bold mb-0">
                        Daily Log
                    </h3>

                    <small class="text-muted">
                        Total Hours:
                        <strong id="totalHoursLabel">0h 0m</strong>
                    </small>
                </div>

                <button
                    type="button"
                    class="btn btn-success d-none"
                    id="addEntryBtn"
                >
                    + Add Entry
                </button>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle attendance-table">

                    <thead class="table-primary text-center">
                        <tr>
                            <th>Date</th>
                            <th class="d-none" id="accountColumnHeader">Staff</th>
                            <th>Clock In</th>
                            <th>Clock Out</th>
                            <th>Branch</th>
                            <th>Hours</th>
                            <th class="d-none" id="actionColumnHeader">Action</th>
                        </tr>
                    </thead>

                    <tbody id="attendanceBody"></tbody>

                </table>
            </div>

            <div
                class="empty-state d-none"
                id="attendanceEmptyState"
            >
                No attendance records found for this period.
            </div>

        </div>
    </div>

</div>

<div
    class="attendance-modal-backdrop d-none"
    id="attendanceModalBackdrop"
>

    <div class="attendance-modal">

        <div class="attendance-modal-header">
            <div>
                <p class="modal-eyebrow">
                    Manual Correction
                </p>

                <h3 id="attendanceModalTitle">
                    Add Attendance Entry
                </h3>
            </div>

            <button
                type="button"
                class="modal-close-btn"
                id="closeAttendanceModalBtn"
                aria-label="Close"
            >
                ×
            </button>
        </div>

        <div class="attendance-modal-body">

            <div class="row g-3">

                <div class="col-12">
                    <label class="form-label">
                        Staff *
                    </label>

                    <select
                        id="modalAttendanceStaff"
                        class="form-select"
                    >
                        <option value="">
                            Select Staff
                        </option>
                    </select>
                </div>

                <div class="col-12 d-none" id="modalAttendanceDutyRoleWrapper">
                    <label class="form-label">
                        Clock In/Out As
                    </label>

                    <select
                        id="modalAttendanceDutyRole"
                        class="form-select"
                    >
                        <option value="Therapist">Therapist</option>
                        <option value="Receptionist">Receptionist</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">
                        Date *
                    </label>

                    <input
                        type="date"
                        id="modalAttendanceDate"
                        class="form-control"
                    >
                </div>

                <div class="col-md-4">
                    <label class="form-label">
                        Clock In
                    </label>

                    <input
                        type="time"
                        id="modalAttendanceClockIn"
                        class="form-control"
                    >
                </div>

                <div class="col-md-4">
                    <label class="form-label">
                        Clock Out
                    </label>

                    <input
                        type="time"
                        id="modalAttendanceClockOut"
                        class="form-control"
                    >
                </div>

                <div class="col-12">
                    <label class="form-label">
                        Shift
                    </label>

                    <select
                        id="modalAttendanceShiftType"
                        class="form-select"
                    >
                        <option value="">Not Specified</option>
                        <option value="Opening">Opening (9:00 AM – 6:00 PM)</option>
                        <option value="Closing">Closing (1:00 PM – 10:00 PM)</option>
                    </select>
                </div>

                <div class="col-12">
                    <label class="form-label">
                        Branch
                    </label>

                    <select
                        id="modalAttendanceBranch"
                        class="form-select"
                    >
                        <option value="">
                            No Branch
                        </option>
                    </select>
                </div>

            </div>

        </div>

        <div class="attendance-modal-footer">

            <button
                type="button"
                class="btn btn-outline-secondary"
                id="cancelAttendanceModalBtn"
            >
                Cancel
            </button>

            <button
                type="button"
                class="btn btn-success"
                id="saveAttendanceModalBtn"
            >
                Save
            </button>

        </div>

    </div>

</div>

<script src="sidebar.js"></script>
<script src="attendance.js"></script>

</body>
</html>
