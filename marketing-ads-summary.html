<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crown Head Spa - Monitoring Summary</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1849">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrownOS">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="marketing.css">

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="pwa-register.js"></script>
    <script src="client-store.js"></script>
    <script src="firebase-sync.js"></script>
    <script src="access-control.js"></script>
    <script src="notifications.js"></script>
</head>

<body>

<div class="container-fluid px-3 px-lg-4 py-4">

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

            <div class="page-heading">
                <div>
                    <h2 class="fw-bold text-primary mb-0">Monitoring Summary</h2>
                    <p class="text-muted mb-0">
                        Per-campaign rollup of the daily Ads Monitoring log.
                    </p>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <a href="home.html" class="btn-dashboard text-decoration-none">
                        ← Back to Dashboard
                    </a>
                </div>
            </div>

        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h5 class="fw-bold text-primary mb-3">Campaign Summary</h5>

            <div class="table-responsive">
                <table class="table marketing-table align-middle">
                    <thead>
                        <tr>
                            <th>Campaign</th>
                            <th>Status</th>
                            <th>CPM (Avg)</th>
                            <th>Cost</th>
                            <th>Impression</th>
                            <th>Views</th>
                            <th>Inquiries</th>
                            <th>Notes</th>
                        </tr>
                    </thead>
                    <tbody id="marketingSummaryTableBody"></tbody>
                </table>
            </div>

            <div class="empty-state d-none" id="marketingSummaryEmptyState">No ads monitoring entries yet.</div>
        </div>
    </div>

    <!-- Notes view modal -->
    <div class="marketing-modal-backdrop d-none" id="marketingNotesBackdrop">
        <div class="marketing-modal">
            <div class="marketing-modal-header">
                <h4 id="marketingNotesTitle">Notes</h4>
                <button type="button" class="marketing-modal-close" id="marketingNotesCloseBtn">&times;</button>
            </div>

            <div class="marketing-modal-body" id="marketingNotesBody"></div>

            <div class="marketing-modal-footer">
                <button type="button" class="btn btn-outline-secondary" id="marketingNotesCloseFooterBtn">Close</button>
            </div>
        </div>
    </div>

</div>

<script src="marketing-ads-summary.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
