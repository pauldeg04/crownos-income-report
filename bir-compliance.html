<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CrownOS - BIR Compliance Desk</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1849">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrownOS">


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="bir-compliance.css">

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="pwa-register.js"></script>
    <script src="client-store.js"></script>
    <script src="firebase-sync.js"></script>
    <script src="access-control.js"></script>
    <script src="notifications.js"></script>
    <script src="push-notifications.js"></script>
</head>

<body>

<div class="container-fluid px-3 px-lg-4 py-4">

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

            <div class="page-heading">
                <div>
                    <p class="page-eyebrow">CrownOS Version 1.0 Stable</p>

                    <h2 class="fw-bold text-primary mb-0">
                        BIR Compliance Desk
                    </h2>

                    <small class="text-muted" id="viewTitle">Dashboard</small>
                </div>

                <div class="bir-header-actions">
                    <div class="bir-period-select">
                        <select id="periodSelect" class="form-select form-select-sm"></select>
                        <button type="button" class="btn btn-outline-secondary btn-sm" id="btnNewPeriod">+ Period</button>
                    </div>

                    <div class="bir-role-switch" id="roleSwitch"></div>

                    <input
                        type="text"
                        id="actingName"
                        class="form-control form-control-sm bir-acting-name"
                        placeholder="Your name (for audit trail)"
                    >

                    <div class="sync-status" id="syncStatus"></div>
                </div>
            </div>

        </div>
    </div>

    <div class="tabs" role="tablist" id="viewTabs"></div>

    <div id="content"></div>

</div>

<script src="sidebar.js"></script>
<script src="bir-compliance.js"></script>

</body>
</html>
